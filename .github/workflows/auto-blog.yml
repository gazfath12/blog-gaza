name: AI Auto Blogging

on:
  schedule:
    - cron: '0 */12 * * *' # Every 12 hours
  workflow_dispatch: # Allows manual triggering

jobs:
  auto-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install axios @google/generative-ai slugify dotenv

      - name: Run Auto Blogging Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          SITE_URL: "https://blog.gazaalfath.my.id" # Update to your production URL
        run: node scripts/auto-blog.js
